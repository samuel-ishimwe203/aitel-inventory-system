# Server Configuration
server.port=8085

# Spring Application Name
spring.application.name=Inventory Management System (IMS)

# Database Configuration (Offline Local File)
spring.datasource.url=jdbc:h2:file:./data/ims_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=24rp00869
spring.datasource.password=22RP03001
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Storage for Reports
app.reports.dir=./reports
