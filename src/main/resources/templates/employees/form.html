<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Employee Form')}"></head>
<body>
    <div th:replace="~{fragments :: sidebar('employees')}"></div>
    
    <div class="main-content">
        <div class="header">
            <h1 th:text="${employee.id != null ? 'Edit Employee' : 'Add New Employee'}">Add New Employee</h1>
        </div>

        <div class="table-container" style="max-width: 600px; padding: 30px;">
            <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="form-group">
                    <label>Staff ID</label>
                    <input type="text" th:field="*{staffId}" required th:readonly="${employee.id != null}">
                </div>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" required>
                </div>
                
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" th:field="*{department}" required>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Save Employee</button>
                    <a th:href="@{/employees}" class="btn" style="background: #95a5a6; color: white;">Cancel</a>
                </div>
            </form>
        </div>

        <div th:replace="~{fragments :: footer}"></div>
    </div>
</body>
</html>
